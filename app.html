<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TBC UZ — RAG Qidiruv</title>
    <!-- CSS qismini o'zgartirmadim, u joyida qoladi -->
    <style>
        :root { --blue:#0038a8; --blue-glow:#2563eb; --red:#e8001c; --gold:#f5c842; --muted:#7b8db8; --text:#e8eeff; --card:rgba(255,255,255,0.05); --border:rgba(255,255,255,0.1); }
        /* Qolgan barcha CSS stillari avvalgidek qoladi */
    </style>
</head>
<body>
    <!-- HTML qismi o'zgarmaydi, faqat <script> qismini yangilaymiz -->
    <!-- (Yuqoridagi HTML kodingizni saqlab qoling) -->

<script>
// TO'G'RILANGAN KOD
const API = ''; 
let TOKEN = '';
let ROLE  = '';
let LANG  = 'uz';
let selectedRag = null;

const T = {
  uz: {
    lblRag: "RAG versiyasini tanlang", searchPh: "Savol yozing...", btnTxt: "Qidirish",
    loading: "AI tahlil qilmoqda...", found: n=>`✓ ${n} ta mos savol topildi`,
    none: "Mos savol topilmadi", noneP: "Boshqa so'z bilan urinib ko'ring.", mos: "mos"
  },
  ru: {
    lblRag: "Выберите версию RAG", searchPh: "Введите вопрос...", btnTxt: "Найти",
    loading: "AI анализирует...", found: n=>`✓ Найдено ${n} похожих вопросов`,
    none: "Похожих вопросов не найдено", noneP: "Попробуйте другую формулировку.", mos: "совп."
  }
};

function t(k,...a){ const fn=T[LANG][k]; return typeof fn==='function'?fn(...a):fn; }

async function api(method, path, body, auth=true){
  const opts={method, headers:{'Content-Type':'application/json'}};
  if(auth) opts.headers['Authorization']='Bearer '+TOKEN;
  if(body) opts.body=JSON.stringify(body);
  const r=await fetch(API + path, opts);
  if (!r.ok) throw new Error(`Server xatosi: ${r.status}`);
  return r.json();
}

async function doSearch(){
  const query = document.getElementById('searchInput').value.trim();
  const status = document.getElementById('statusBar');
  const resDiv = document.getElementById('results');

  if(!selectedRag){ status.className='status err'; status.textContent=t('lblRag'); return; }
  if(!query){ status.className='status err'; status.textContent='Savol kiriting!'; return; }

  status.className='status loading';
  status.innerHTML='<span class="spinner"></span>' + t('loading');
  document.getElementById('searchBtn').disabled = true;

  try {
    const d = await api('POST', '/api/search', { rag_id: selectedRag, query: query });
    
    if(!d.results || d.results.length === 0){
      status.className='status';
      status.textContent = t('none');
      resDiv.innerHTML = `<div class="empty"><p>${t('noneP')}</p></div>`;
    } else {
      status.className='status ok';
      status.textContent = t('found', d.results.length);
      resDiv.innerHTML = '';
      d.results.forEach(item => {
        const score = Math.round(item.score * 100);
        const card = document.createElement('div');
        card.className = 'result-card';
        card.innerHTML = `
          <div class="id-col"><div class="id-num">${item.id}</div></div>
          <div class="card-body">
            <div class="q-main">${item.question}</div>
            <div class="q-sub">${item.answer}</div>
            <div class="score-row"><div class="score-txt">${score}% ${t('mos')}</div></div>
          </div>`;
        resDiv.appendChild(card);
      });
    }
  } catch(e) {
    status.className='status err';
    status.textContent='Xatolik: ' + e.message;
  } finally {
    document.getElementById('searchBtn').disabled = false;
  }
}
// Qolgan funksiyalaringiz (doLogin, loadRags va h.k.) shu yerda qolishi kerak.
</script>
</body>
</html>
